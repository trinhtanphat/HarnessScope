[workspace]
resolver = "2"
members = [
  "crates/harnesscope-core",
  "crates/harnesscope-parity",
  "crates/harnesscope-collector-sdk",
  "crates/harnesscope-collectors",
  "apps/tauri/src-tauri"
]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
regex = "=1.13.1"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
url = "=2.5.8"
csv = "=1.4.0"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
sysinfo = "=0.39.6"
crossbeam-channel = "=0.5.15"
notify = "=8.2.0"
sha2 = "=0.10.9"
