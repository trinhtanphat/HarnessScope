[package]
name = "harnesscope-tauri"
version = "0.3.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
harnesscope-core = { path = "../../../crates/harnesscope-core" }
harnesscope-collector-sdk = { path = "../../../crates/harnesscope-collector-sdk" }
harnesscope-collectors = { path = "../../../crates/harnesscope-collectors" }
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = "=2.11.5"
tauri-plugin-dialog = "=2.7.3"

[build-dependencies]
tauri-build = "=2.6.3"
