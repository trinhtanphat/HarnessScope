name: rustfmt-task4

on:
  push:
    branches:
      - feature/v0.3-tauri-rust-incremental

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo +1.98.1 fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          git add crates
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply rustfmt to Task 4 [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
