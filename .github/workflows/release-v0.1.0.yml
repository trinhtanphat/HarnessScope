name: release-v0.1.0

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VERSION: v0.1.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Check whether release already exists
        id: guard
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package version
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "0.1.0"

      - name: Build release archives
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage

          git archive --format=zip --prefix=HarnessScope-v0.1.0/ "$TARGET_SHA" \
            -o dist/HarnessScope-v0.1.0-source.zip

          make_stage() {
            name="$1"
            root="stage/$name/HarnessScope-v0.1.0"
            mkdir -p "$root"
            cp -a bin src ui fixtures docs README.md LICENSE package.json "$root/"
          }

          make_stage windows
          printf '@echo off\r\nnode "%%~dp0bin\\harnesscope.mjs" %%*\r\n' \
            > stage/windows/HarnessScope-v0.1.0/harnesscope.cmd
          (cd stage/windows && zip -qr ../../dist/HarnessScope-v0.1.0-windows.zip HarnessScope-v0.1.0)

          make_stage macos
          cat > stage/macos/HarnessScope-v0.1.0/harnesscope <<'SH'
          #!/bin/sh
          SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec node "$SCRIPT_DIR/bin/harnesscope.mjs" "$@"
          SH
          chmod +x stage/macos/HarnessScope-v0.1.0/harnesscope
          tar -C stage/macos -czf dist/HarnessScope-v0.1.0-macos-universal.tar.gz HarnessScope-v0.1.0

          make_stage linux
          cp stage/macos/HarnessScope-v0.1.0/harnesscope stage/linux/HarnessScope-v0.1.0/harnesscope
          chmod +x stage/linux/HarnessScope-v0.1.0/harnesscope
          tar -C stage/linux -czf dist/HarnessScope-v0.1.0-linux.tar.gz HarnessScope-v0.1.0

          (cd dist && sha256sum HarnessScope-v0.1.0-* > SHA256SUMS.txt)

      - name: Create v0.1.0 tag and GitHub Release
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "HarnessScope v0.1.0" \
            --notes "HarnessScope v0.1.0 initial release.\n\nValidated by GitHub Actions on Ubuntu, Windows and macOS before release. Portable packages require Node.js 22+. The macOS package is architecture-independent JavaScript (not a signed native .app yet)." \
            dist/HarnessScope-v0.1.0-source.zip \
            dist/HarnessScope-v0.1.0-windows.zip \
            dist/HarnessScope-v0.1.0-macos-universal.tar.gz \
            dist/HarnessScope-v0.1.0-linux.tar.gz \
            dist/SHA256SUMS.txt
