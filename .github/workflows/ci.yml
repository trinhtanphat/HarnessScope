name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    name: node-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Node tests
        run: npm test
        env:
          NODE_NO_WARNINGS: "1"

  rust-core:
    name: rust-core (${{ matrix.os }})
    needs: node-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Rust format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Rust clippy
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +1.98.1 test --workspace
      - name: Tauri shell check
        run: cargo +1.98.1 check -p harnesscope-tauri

  parity:
    name: parity
    needs: [node-test, rust-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Node/Rust semantic parity
        run: node scripts/run-parity.mjs
        env:
          HARNESSCOPE_RUST_PARITY: "1"
          NODE_NO_WARNINGS: "1"

  tauri-windows:
    name: tauri-windows
    needs: [node-test, rust-core, parity]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain and Windows target
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 x86_64-pc-windows-msvc
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Verify before native packaging
        run: |
          npm test
          cargo +1.98.1 check -p harnesscope-tauri
        env:
          NODE_NO_WARNINGS: "1"
      - name: Build unsigned Windows Tauri bundles
        run: npm run tauri:win
      - name: Normalize Windows installer and portable package
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1
      - name: Validate Windows artifacts
        shell: pwsh
        run: |
          $required = @(
            'dist/tauri/HarnessScope-0.3.0-windows-x64-Setup.exe',
            'dist/tauri/HarnessScope-0.3.0-windows-x64.msi',
            'dist/tauri/HarnessScope-0.3.0-windows-x64-portable.zip'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required artifact: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty required artifact: $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HarnessScope-0.3.0-windows-x64
          path: |
            dist/tauri/HarnessScope-0.3.0-windows-x64-Setup.exe
            dist/tauri/HarnessScope-0.3.0-windows-x64.msi
            dist/tauri/HarnessScope-0.3.0-windows-x64-portable.zip
          if-no-files-found: error

  tauri-macos:
    name: tauri-macos
    needs: [node-test, rust-core, parity]
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain and universal targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-apple-darwin x86_64-apple-darwin
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Verify before native packaging
        run: |
          npm test
          cargo +1.98.1 check -p harnesscope-tauri
        env:
          NODE_NO_WARNINGS: "1"
      - name: Build unsigned universal macOS Tauri bundles
        run: npm run tauri:mac
      - name: Normalize macOS DMG and app archive
        run: bash scripts/package-macos-app.sh
      - name: Validate macOS artifacts
        run: |
          test -s dist/tauri/HarnessScope-0.3.0-macos-universal.dmg
          test -s dist/tauri/HarnessScope-0.3.0-macos-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HarnessScope-0.3.0-macos-universal
          path: |
            dist/tauri/HarnessScope-0.3.0-macos-universal.dmg
            dist/tauri/HarnessScope-0.3.0-macos-universal.app.zip
          if-no-files-found: error
