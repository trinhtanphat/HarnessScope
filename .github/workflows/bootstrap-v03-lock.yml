name: bootstrap-v03-lock

on:
  push:
    branches:
      - feature/v0.3-tauri-rust-incremental
    paths:
      - package.json
      - .github/workflows/bootstrap-v03-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile back to carrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "build: lock V0.3 desktop dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
